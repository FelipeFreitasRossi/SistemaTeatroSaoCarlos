<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Teatro Municipal</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ========== RESET E ESTILOS BASE ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0B0B0B;
            color: #F5F5F5;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 30px;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-brand img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .header-brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }
        .header-brand h1 span { color: #888; }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header-actions .badge {
            background: rgba(255,255,255,0.06);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: #ffffff; color: #0B0B0B; }
        .btn-primary:hover { background: #e0e0e0; transform: scale(1.02); }
        .btn-success { background: #2b7a4b; color: #fff; }
        .btn-success:hover { background: #1f5f39; }
        .btn-warning { background: #b8860b; color: #fff; }
        .btn-warning:hover { background: #9a7109; }
        .btn-danger { background: #b22222; color: #fff; }
        .btn-danger:hover { background: #8b1a1a; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.12); color: #ccc; }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

        /* Cards de estatísticas */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 18px 16px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.12);
            transform: translateY(-2px);
        }
        .stat-card .stat-number { font-size: 28px; font-weight: 700; color: #fff; line-height: 1.2; }
        .stat-card .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-top: 4px; }
        .stat-card .stat-icon { font-size: 20px; color: #888; margin-bottom: 6px; }

        /* Tabela */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(4px);
            margin-top: 6px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 600px; }
        th {
            text-align: left;
            padding: 14px 16px;
            background: rgba(255,255,255,0.03);
            color: #aaa;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border: 1px solid transparent;
        }
        .status-breve { background: rgba(255,255,255,0.08); color: #aaa; border-color: rgba(255,255,255,0.1); }
        .status-cartaz { background: rgba(255,215,0,0.12); color: #e8c766; border-color: rgba(255,215,0,0.15); }
        .status-encerrado { background: rgba(100,100,100,0.15); color: #888; border-color: rgba(100,100,100,0.1); }
        .status-cancelado { background: rgba(200,50,50,0.12); color: #e06666; border-color: rgba(200,50,50,0.15); }

        .img-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #222; border: 1px solid rgba(255,255,255,0.05); }
        .text-truncate { max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .actions-cell { display: flex; gap: 4px; flex-wrap: wrap; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeOverlay 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }
        .modal-box {
            background: #141414;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            max-width: 540px;
            width: 100%;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: slideUp 0.35s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-box h2 { font-family: 'Playfair Display', serif; font-size: 24px; margin-bottom: 4px; color: #fff; }
        .modal-box .sub { color: #888; font-size: 14px; margin-bottom: 24px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; color: #aaa; margin-bottom: 4px; }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: #0B0B0B;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: #f5f5f5;
            font-size: 14px;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
            flex-wrap: wrap;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 14px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            animation: slideIn 0.35s ease;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.success { border-left: 4px solid #2b7a4b; }
        .toast.error { border-left: 4px solid #b22222; }
        .toast.info { border-left: 4px solid #b8860b; }
        .toast .toast-icon { font-size: 20px; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Login */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0B0B0B;
            padding: 20px;
        }
        .login-box {
            background: #141414;
            padding: 40px 32px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .login-box .logo { width: 60px; height: 60px; object-fit: contain; border-radius: 50%; margin-bottom: 16px; background: rgba(255,255,255,0.05); padding: 4px; border: 1px solid rgba(255,255,255,0.08); }
        .login-box h2 { font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 4px; color: #fff; }
        .login-box p { color: #888; font-size: 14px; margin-bottom: 24px; }
        .login-box input { width: 100%; padding: 12px 14px; margin-bottom: 12px; background: #0B0B0B; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #fff; font-size: 14px; }
        .login-box input:focus { outline: none; border-color: rgba(255,255,255,0.25); }
        .login-box .btn { width: 100%; justify-content: center; margin-top: 4px; }
        .login-box .hint { margin-top: 16px; font-size: 12px; color: #444; }

        .hidden { display: none !important; }

        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; color: #444; }
        .empty-state h3 { color: #aaa; font-weight: 400; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; color: #555; }

        .loading-spinner { text-align:center; padding:40px; color:#666; }
    </style>
</head>
<body>

<!-- ============================================================
TELA DE LOGIN
============================================================ -->
<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <img src="https://i.postimg.cc/j5g22R73/Theatrical-masks-set-Premium-Vector.jpg" alt="Logo Teatro Municipal" class="logo">
        <h2>Painel Admin</h2>
        <p>Digite suas credenciais para acessar</p>
        <form id="loginForm" onsubmit="return fazerLogin(event)">
            <input type="text" id="loginUser" placeholder="Usuário" value="admin" required autofocus>
            <input type="password" id="loginPass" placeholder="Senha" value="admin123" required>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <p class="hint">Padrão: admin / admin123</p>
    </div>
</div>

<!-- ============================================================
PAINEL PRINCIPAL
============================================================ -->
<div id="appContainer" class="container hidden">

    <header class="header">
        <div class="header-brand">
            <img src="https://i.postimg.cc/j5g22R73/Theatrical-masks-set-Premium-Vector.jpg" alt="Logo">
            <h1>Teatro<span>Municipal</span></h1>
        </div>
        <div class="header-actions">
            <span class="badge"><i class="fas fa-lock"></i> Admin</span>
            <button class="btn btn-primary btn-sm" onclick="abrirModalCriar()">
                <i class="fas fa-plus"></i> Novo Evento
            </button>
            <button class="btn btn-outline btn-sm" onclick="sair()">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>
    </header>

    <section class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-calendar-alt"></i></div>
            <div class="stat-number" id="totalEventos">0</div>
            <div class="stat-label">Total de Eventos</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-play-circle"></i></div>
            <div class="stat-number" id="totalEmCartaz">0</div>
            <div class="stat-label">Em Cartaz</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-hourglass-half"></i></div>
            <div class="stat-number" id="totalBreve">0</div>
            <div class="stat-label">Em Breve</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
            <div class="stat-number" id="totalEncerrados">0</div>
            <div class="stat-label">Encerrados</div>
        </div>
    </section>

    <div id="eventosContainer">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top:12px;">Carregando eventos...</p>
        </div>
    </div>
</div>

<!-- ============================================================
MODAL
============================================================ -->
<div id="modalOverlay" class="modal-overlay">
    <div class="modal-box">
        <h2 id="modalTitle">Novo Evento</h2>
        <p class="sub" id="modalSub">Preencha os dados para criar um novo evento</p>
        <form id="modalForm" onsubmit="return salvarEvento(event)">
            <input type="hidden" id="eventoId" value="">

            <div class="form-group">
                <label for="editTitulo"><i class="fas fa-heading"></i> Título</label>
                <input type="text" id="editTitulo" placeholder="Nome do espetáculo" required>
            </div>

            <div class="form-group">
                <label for="editDescricao"><i class="fas fa-align-left"></i> Descrição</label>
                <textarea id="editDescricao" placeholder="Descreva o evento..." required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="editDataHora"><i class="fas fa-calendar"></i> Data/Hora</label>
                    <input type="datetime-local" id="editDataHora" required>
                </div>
                <div class="form-group">
                    <label for="editCapacidade"><i class="fas fa-users"></i> Capacidade</label>
                    <input type="number" id="editCapacidade" min="1" value="100" required>
                </div>
            </div>

            <div class="form-group">
                <label for="editLocal"><i class="fas fa-map-pin"></i> Local</label>
                <input type="text" id="editLocal" placeholder="Sala Principal, Teatro Municipal" required>
            </div>

            <div class="form-group">
                <label for="editImagem"><i class="fas fa-image"></i> URL da Imagem</label>
                <input type="url" id="editImagem" placeholder="https://exemplo.com/imagem.jpg">
            </div>

            <div class="form-group">
                <label for="editStatus"><i class="fas fa-tag"></i> Status</label>
                <select id="editStatus">
                    <option value="BREVE">Em Breve</option>
                    <option value="EM_CARTAZ">Em Cartaz</option>
                    <option value="ENCERRADO">Encerrado</option>
                    <option value="CANCELADO">Cancelado</option>
                </select>
            </div>

            <!-- NOVO CAMPO -->
            <div class="form-group">
                <label for="editLocalVenda"><i class="fas fa-ticket-alt"></i> Local de compra do ingresso</label>
                <select id="editLocalVenda">
                    <option value="Portaria principal">Portaria principal</option>
                    <option value="Bilheteria">Bilheteria</option>
                    <option value="Online">Online</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
                <button type="submit" class="btn btn-success" id="modalSubmitBtn">
                    <i class="fas fa-save"></i> Salvar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toastContainer" class="toast-container"></div>

<script>
    // ============================================================
    //  CONFIGURAÇÃO
    // ============================================================
    const API_BASE = '';
    let authToken = '';

    // ============================================================
    //  LOGIN
    // ============================================================
    function fazerLogin(event) {
        event.preventDefault();
        const user = document.getElementById('loginUser').value.trim();
        const pass = document.getElementById('loginPass').value.trim();

        if (!user || !pass) {
            mostrarToast('Preencha usuário e senha.', 'error');
            return false;
        }

        authToken = btoa(`${user}:${pass}`);

        fetch(`${API_BASE}/api/eventos/admin/todos`, {
            headers: { 'Authorization': `Basic ${authToken}` }
        })
            .then(res => {
                if (res.status === 401 || res.status === 403) throw new Error('Usuário ou senha incorretos.');
                if (!res.ok) throw new Error('Erro ao conectar com o servidor.');
                return res.json();
            })
            .then(() => {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                carregarEventos();
                mostrarToast('Bem-vindo! 👋', 'success');
            })
            .catch(err => {
                mostrarToast(err.message || 'Falha no login.', 'error');
                authToken = '';
            });

        return false;
    }

    function sair() {
        authToken = '';
        document.getElementById('appContainer').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('loginPass').value = '';
        mostrarToast('Desconectado.', 'info');
    }

    // ============================================================
    //  CARREGAR EVENTOS
    // ============================================================
    function carregarEventos() {
        const container = document.getElementById('eventosContainer');
        container.innerHTML = `
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top:12px;">Carregando eventos...</p>
                </div>
            `;

        fetch(`${API_BASE}/api/eventos/admin/todos`, {
            headers: { 'Authorization': `Basic ${authToken}` }
        })
            .then(res => {
                if (!res.ok) throw new Error('Erro ao buscar eventos.');
                return res.json();
            })
            .then(eventos => {
                atualizarEstatisticas(eventos);
                if (!eventos || eventos.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon"><i class="fas fa-theater-masks"></i></div>
                            <h3>Nenhum evento cadastrado</h3>
                            <p>Clique em "Novo Evento" para começar.</p>
                        </div>
                    `;
                    return;
                }
                container.innerHTML = gerarTabela(eventos);
            })
            .catch(err => {
                container.innerHTML = `
                    <div class="empty-state" style="color:#b22222;">
                        <div class="icon"><i class="fas fa-exclamation-triangle"></i></div>
                        <h3>Erro ao carregar</h3>
                        <p>${err.message}</p>
                    </div>
                `;
                mostrarToast(err.message, 'error');
            });
    }

    // ============================================================
    //  ATUALIZAR ESTATÍSTICAS
    // ============================================================
    function atualizarEstatisticas(eventos) {
        const total = eventos.length;
        const emCartaz = eventos.filter(e => e.status === 'EM_CARTAZ').length;
        const breve = eventos.filter(e => e.status === 'BREVE').length;
        const encerrados = eventos.filter(e => e.status === 'ENCERRADO' || e.status === 'CANCELADO').length;

        document.getElementById('totalEventos').textContent = total;
        document.getElementById('totalEmCartaz').textContent = emCartaz;
        document.getElementById('totalBreve').textContent = breve;
        document.getElementById('totalEncerrados').textContent = encerrados;
    }

    // ============================================================
    //  GERAR TABELA
    // ============================================================
    function gerarTabela(eventos) {
        let html = `
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Imagem</th>
                                <th>Título</th>
                                <th>Data</th>
                                <th>Local</th>
                                <th>Status</th>
                                <th style="text-align:right;">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

        eventos.forEach(e => {
            const statusMap = {
                'BREVE': 'status-breve',
                'EM_CARTAZ': 'status-cartaz',
                'ENCERRADO': 'status-encerrado',
                'CANCELADO': 'status-cancelado'
            };
            const statusClass = statusMap[e.status] || 'status-breve';
            const dataFormatada = e.dataHora ? new Date(e.dataHora).toLocaleString('pt-BR') : '-';

            html += `
                    <tr>
                        <td>
                            <img src="${e.imagemUrl || ''}" alt="${e.titulo}" class="img-thumb"
                                 onerror="this.style.display='none'">
                        </td>
                        <td><strong>${e.titulo}</strong></td>
                        <td>${dataFormatada}</td>
                        <td>${e.local || '-'}</td>
                        <td><span class="status-badge ${statusClass}">${e.status}</span></td>
                        <td style="text-align:right;">
                            <div class="actions-cell" style="justify-content:flex-end;">
                                <button class="btn btn-warning btn-sm" onclick="abrirModalEditar(${e.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="deletarEvento(${e.id})">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
        });

        html += `
                        </tbody>
                    </table>
                </div>
            `;
        return html;
    }

    // ============================================================
    //  MODAL
    // ============================================================
    function abrirModalCriar() {
        document.getElementById('modalTitle').textContent = 'Novo Evento';
        document.getElementById('modalSub').textContent = 'Preencha os dados para criar um novo evento';
        document.getElementById('eventoId').value = '';
        document.getElementById('modalForm').reset();
        document.getElementById('editCapacidade').value = 100;
        document.getElementById('editStatus').value = 'BREVE';
        document.getElementById('editLocalVenda').value = 'Portaria principal';
        document.getElementById('modalSubmitBtn').innerHTML = '<i class="fas fa-plus"></i> Criar Evento';
        document.getElementById('modalOverlay').classList.add('active');
        setTimeout(() => document.getElementById('editTitulo').focus(), 100);
    }

    function abrirModalEditar(id) {
        fetch(`${API_BASE}/api/eventos/${id}`, {
            headers: { 'Authorization': `Basic ${authToken}` }
        })
            .then(res => {
                if (!res.ok) throw new Error('Erro ao buscar evento.');
                return res.json();
            })
            .then(evento => {
                document.getElementById('modalTitle').textContent = 'Editar Evento';
                document.getElementById('modalSub').textContent = 'Altere as informações do evento';
                document.getElementById('eventoId').value = evento.id;
                document.getElementById('editTitulo').value = evento.titulo || '';
                document.getElementById('editDescricao').value = evento.descricao || '';
                document.getElementById('editDataHora').value = evento.dataHora ? evento.dataHora.slice(0, 16) : '';
                document.getElementById('editCapacidade').value = evento.capacidadeTotal || 100;
                document.getElementById('editLocal').value = evento.local || '';
                document.getElementById('editImagem').value = evento.imagemUrl || '';
                document.getElementById('editStatus').value = evento.status || 'BREVE';
                document.getElementById('editLocalVenda').value = evento.localVendaIngressos || 'Portaria principal';
                document.getElementById('modalSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Atualizar';
                document.getElementById('modalOverlay').classList.add('active');
                setTimeout(() => document.getElementById('editTitulo').focus(), 100);
            })
            .catch(err => {
                mostrarToast(err.message, 'error');
            });
    }

    function fecharModal() {
        document.getElementById('modalOverlay').classList.remove('active');
    }

    // ============================================================
    //  SALVAR
    // ============================================================
    function salvarEvento(event) {
        event.preventDefault();

        const id = document.getElementById('eventoId').value;
        const dados = {
            titulo: document.getElementById('editTitulo').value.trim(),
            descricao: document.getElementById('editDescricao').value.trim(),
            dataHora: document.getElementById('editDataHora').value,
            capacidadeTotal: parseInt(document.getElementById('editCapacidade').value) || 1,
            local: document.getElementById('editLocal').value.trim(),
            imagemUrl: document.getElementById('editImagem').value.trim(),
            status: document.getElementById('editStatus').value,
            localVendaIngressos: document.getElementById('editLocalVenda').value,
        };

        if (!dados.titulo || !dados.descricao || !dados.dataHora || !dados.local) {
            mostrarToast('Preencha todos os campos obrigatórios.', 'error');
            return false;
        }

        const url = id ? `${API_BASE}/api/eventos/admin/${id}` : `${API_BASE}/api/eventos/admin`;
        const method = id ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: {
                'Authorization': `Basic ${authToken}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dados)
        })
            .then(res => {
                if (!res.ok) {
                    return res.text().then(t => { throw new Error(t || 'Erro ao salvar.'); });
                }
                return res.json();
            })
            .then(() => {
                fecharModal();
                carregarEventos();
                mostrarToast(id ? '✅ Evento atualizado!' : '✅ Evento criado com sucesso!', 'success');
            })
            .catch(err => {
                mostrarToast(err.message, 'error');
            });

        return false;
    }

    // ============================================================
    //  DELETAR
    // ============================================================
    function deletarEvento(id) {
        if (!confirm('Tem certeza que deseja excluir este evento permanentemente?')) return;

        fetch(`${API_BASE}/api/eventos/admin/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Basic ${authToken}` }
        })
            .then(res => {
                if (!res.ok) throw new Error('Erro ao excluir evento.');
                carregarEventos();
                mostrarToast('🗑️ Evento excluído.', 'info');
            })
            .catch(err => {
                mostrarToast(err.message, 'error');
            });
    }

    // ============================================================
    //  TOAST
    // ============================================================
    function mostrarToast(mensagem, tipo = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${tipo}`;

        const icons = {
            success: 'fas fa-check-circle',
            error: 'fas fa-exclamation-circle',
            info: 'fas fa-info-circle'
        };
        const icon = icons[tipo] || icons.info;

        toast.innerHTML = `
                <span class="toast-icon"><i class="${icon}"></i></span>
                <span>${mensagem}</span>
            `;

        container.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(40px)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 300);
        }, 3500);
    }

    // ============================================================
    //  FECHAR MODAL AO CLICAR FORA
    // ============================================================
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
        if (e.target === this) fecharModal();
    });

    // ============================================================
    //  ENTER NO LOGIN
    // ============================================================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !document.getElementById('loginScreen').classList.contains('hidden')) {
            const form = document.getElementById('loginForm');
            if (form) form.dispatchEvent(new Event('submit'));
        }
    });

    console.log('🎭 Painel Admin carregado. Use admin/admin123 para entrar.');
</script>
</body>
</html>

# ==========================================
# CONFIGURAÇÕES PARA PRODUÇÃO (RENDER)
# USANDO POSTGRESQL
# ==========================================

# PostgreSQL – a URL será fornecida pelo Render via variável de ambiente
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Cria/Atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Fuso horário
spring.jackson.time-zone=America/Sao_Paulo

# Desabilita o warning do open-in-view
spring.jpa.open-in-view=false

# Porta que o Render vai usar (importante!)
server.port=${PORT:8080}
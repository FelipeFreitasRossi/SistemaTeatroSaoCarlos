# Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/teatro_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=patty101
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - validação (não cria tabelas automaticamente)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desabilita o warning do open-in-view
spring.jpa.open-in-view=false

# Fuso horário
spring.jackson.time-zone=America/Sao_Paulo